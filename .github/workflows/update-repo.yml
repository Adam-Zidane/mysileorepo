name: Update Sileo Repository

on:
  push:
    branches:
      - main
    paths:
      - '*.deb'
      - '**/*.deb'
      - '.github/workflows/update-repo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Generate Packages
        run: |
          dpkg-scanpackages --multiversion . /dev/null > Packages

      - name: Compress Packages
        run: |
          gzip -9 -f -k Packages

      - name: Generate Release
        run: |
          apt-ftparchive release . > Release

      - name: Commit Repository Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          git diff --cached --quiet || git commit -m "Automatically update Sileo repository"
          git push
