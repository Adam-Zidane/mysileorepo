```yaml
name: Update Sileo Repository

on:
  push:
    branches:
      - main
    paths:
      - '*.deb'
      - '**/*.deb'
      - '.github/workflows/update-repo.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gzip

      - name: Generate Packages
        run: |
          dpkg-scanpackages --multiversion . /dev/null > Packages

      - name: Generate Packages.gz
        run: |
          gzip -9 -n -c Packages > Packages.gz

      - name: Generate Release
        run: |
          cat > Release << 'EOF'
          Origin: ZidaneAdam
          Label: ZidaneAdam Sileo Repository
          Suite: stable
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: Personal iOS Tweak Repository
          EOF

          apt-ftparchive release . >> Release

      - name: Commit Updated Repository Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Packages Packages.gz Release

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update Sileo repository metadata"
            git push
          fi
```
